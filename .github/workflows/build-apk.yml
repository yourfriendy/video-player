name: Build APK

# Fast path: this workflow builds and publishes ONLY the small OffScroll.apk (about 10 MB), then triggers
# build-engine.yml as a separate run for the big OffScroll-Engine.apk (about 50 MB), so the app is
# available minutes sooner instead of waiting for both.

on:
  # Every push to ANY branch builds an APK (attached to the run as the "OffScroll-apk" artifact).
  # Only pushes to main publish the public "latest" release. Docs-only pushes don't build.
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # lets this workflow start the engine build (gh workflow run)

concurrency:
  # One build per branch, so a feature-branch build never cancels (or replaces) a main build
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & publish OffScroll.apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "Using the repository's signing key (updates install over older builds)"
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS"
          else
            echo "::warning::No ANDROID_KEYSTORE_* secrets found: using a throw-away key. Each build will have a different signature, so Android will refuse to update over an older install (uninstall first)."
            PASS="offscroll-ci"
            keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OffScroll,O=OffScroll,C=US"
          fi
          {
            echo "KEYSTORE_PATH=$KS"
            echo "STORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo "KEY_ALIAS=upload"
          } >> "$GITHUB_ENV"
          # Print the certificate fingerprint: it is what you register with Google (and what users can compare)
          FP=$(keytool -list -v -keystore "$KS" -storepass "$PASS" -alias upload 2>/dev/null | grep -m1 "SHA256:" | sed 's/.*SHA256: *//')
          echo "CERT_SHA256=$FP" >> "$GITHUB_ENV"
          {
            echo "### Signing certificate"
            echo
            echo "SHA-256: \`$FP\`"
            echo
            echo "Register this fingerprint with the package name in the Android Developer Console (see docs/VERIFY-WITH-GOOGLE.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests, then build the release APK (R8-optimised)
        working-directory: video player
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --tests "com.example.data.download.*" --tests "com.example.data.update.*" --tests "com.example.data.universal.*" :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Surface build errors as annotations
        if: failure()
        run: |
          if [ -f build.log ]; then
            ERR=$(grep -E "^e: |error:|What went wrong|Execution failed|Could not |not found|FAILED|expected:|AssertionError|ComparisonFailure" build.log | head -40 | cut -c1-400 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build errors::${ERR}"
          else
            echo "::error title=Build errors::no build.log (failed before the Gradle step)"
          fi

      - name: Name the APK
        run: |
          cp "video player/app/build/outputs/apk/release/app-release.apk" OffScroll.apk
          ls -l OffScroll.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OffScroll-apk
          path: OffScroll.apk

      - name: Branch build (public release left untouched)
        if: github.ref != 'refs/heads/main'
        run: echo "::notice title=APK built::Download it from this run's Artifacts (OffScroll-apk). The public latest release is only updated from main."

      - name: Publish to the repo's Releases (shows on the main page)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          # The app's in-app updater reads the "Build number:" line below to decide whether this
          # release is newer than the installed one (build number = versionCode). Keep that line.
          cat > release-notes.md <<NOTES
          ## OffScroll – latest build

          Install **OffScroll.apk** on your Android phone (Android 7.0+).

          Want to save from YouTube, Facebook, TikTok, Snapchat, X and 1000+ more sites? Also install
          **OffScroll-Engine.apk** (about 50 MB), or tap "Download and install engine" on the Any link tab
          inside OffScroll. It is optional: OffScroll itself stays small without it. A fresh engine build
          is attached a few minutes after the app (the previous one stays attached until then).

          - Build number: ${GITHUB_RUN_NUMBER}
          - Commit: \`${SHORT_SHA}\`
          - Built: $(date -u +"%Y-%m-%d %H:%M UTC")
          - Release build: optimised with R8 for smooth scrolling. Android may ask you to allow installs from your browser or file manager.
          - Signing certificate SHA-256: \`${CERT_SHA256}\` (package \`com.aistudio.offscroll.vfeed\`; the engine is \`com.aistudio.offscroll.engine\`)
          - Not from the Play Store? Play Protect may offer to scan the app first: tap More details, then Install anyway (or Scan app, then install). Every build is signed with the same key.
          NOTES
          sed -i 's/^          //' release-notes.md

          # The release is recreated on every build, so keep the engine that is already attached
          # (the engine workflow replaces it with a fresh one a few minutes later)
          mkdir -p keep
          gh release download latest -p OffScroll-Engine.apk -D keep 2>/dev/null || true
          ASSETS="OffScroll.apk"
          [ -f keep/OffScroll-Engine.apk ] && ASSETS="$ASSETS keep/OffScroll-Engine.apk"

          gh release delete latest --yes --cleanup-tag || true
          gh release create latest $ASSETS \
            --title "OffScroll – latest build" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            --latest

      - name: Start the engine build (separate run, so this one is already done)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh workflow run build-engine.yml --ref "$GITHUB_REF_NAME"; then
            echo "::notice title=Engine build started::OffScroll-Engine.apk is building in its own run."
          else
            # Happens on a branch before build-engine.yml has been merged to main: the engine workflow's own
            # push trigger covers that case, so this must not fail the app build
            echo "::warning title=Engine build not started from here::Couldn't dispatch build-engine.yml (normal on a new branch). It also starts by itself on pushes that touch the engine."
          fi
