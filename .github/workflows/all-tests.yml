name: All unit tests

# build-apk.yml only runs the data.download, data.update and data.universal tests (so a UI-only test can never
# stop a release). This workflow runs EVERY unit test (data.* and ui.*, including the design-token lint and the
# smart-title tests) on each push and pull request, so those tests are checked too. It does not publish anything.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: gradle :app:testDebugUnitTest
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Cache Robolectric's Android jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('video player/gradle/libs.versions.toml', 'video player/app/build.gradle*') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Run every unit test (one retry for a flaky dependency download)
        working-directory: video player
        run: |
          set -o pipefail
          run_tests() { gradle :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee -a "$GITHUB_WORKSPACE/tests.log"; }
          run_tests || { echo "::warning title=Tests retried::First attempt failed (often a flaky download). Trying once more."; run_tests; }

      - name: Surface failures as annotations
        if: failure()
        run: |
          if [ -f tests.log ]; then
            ERR=$(grep -E "^e: |error:|What went wrong|Execution failed|FAILED|expected:|AssertionError|ComparisonFailure" tests.log | head -40 | cut -c1-400 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Unit test failures::${ERR}"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: video player/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
