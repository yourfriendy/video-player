name: Brain check

# Runs on every push and pull request: keeps the AI brain honest (no secrets committed,
# STRUCTURE.md lists every file, the tool itself still works). Stdlib Python only.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  brain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Selftest
        run: python3 brain/brain.py selftest
      - name: Secret scan
        run: python3 brain/brain.py secrets --all
      - name: STRUCTURE.md covers every file
        run: python3 brain/brain.py structure
