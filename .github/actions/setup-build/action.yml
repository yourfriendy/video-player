name: Set up the Android build
description: JDK 21, the Android SDK licences and Gradle 9.3.1 with its cache. Run it right after checkout.

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: "21"

    - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
      shell: bash
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
      with:
        gradle-version: "9.3.1"
