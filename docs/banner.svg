<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="OffScroll – your offline reels player">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070514"/>
      <stop offset="0.55" stop-color="#140a33"/>
      <stop offset="1" stop-color="#25104d"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- film-strip dots -->
  <g fill="url(#brand)" opacity="0.55">
    <circle cx="48" cy="60" r="5"/><circle cx="48" cy="100" r="5"/><circle cx="48" cy="140" r="5"/><circle cx="48" cy="180" r="5"/>
    <circle cx="48" cy="220" r="5"/><circle cx="48" cy="260" r="5"/><circle cx="48" cy="300" r="5"/><circle cx="48" cy="340" r="5"/>
  </g>

  <!-- title -->
  <text x="110" y="200" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="108" font-weight="800" letter-spacing="-3" fill="url(#brand)">OffScroll</text>
  <text x="114" y="256" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#e2e8f0">Your own videos, in a reels-style feed.</text>
  <text x="114" y="300" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#94a3b8">Offline · No account · No ads · Android</text>

  <!-- stylised phone -->
  <g transform="translate(900 52) rotate(6 110 158)">
    <rect x="0" y="0" width="220" height="316" rx="34" fill="#0b0a1a" stroke="url(#brand)" stroke-width="3"/>
    <rect x="14" y="16" width="192" height="284" rx="24" fill="#150f33"/>
    <rect x="14" y="16" width="192" height="284" rx="24" fill="url(#glowB)"/>
    <!-- play button -->
    <circle cx="110" cy="136" r="42" fill="#ffffff" fill-opacity="0.08" stroke="url(#brand)" stroke-width="3"/>
    <path d="M98 114 L98 158 L136 136 Z" fill="url(#brand)"/>
    <!-- action rail -->
    <g fill="#ffffff" fill-opacity="0.85">
      <circle cx="184" cy="190" r="9"/><circle cx="184" cy="222" r="9"/><circle cx="184" cy="254" r="9"/>
    </g>
    <!-- progress bar -->
    <rect x="30" y="276" width="140" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="30" y="276" width="86" height="5" rx="2.5" fill="url(#brand)"/>
    <!-- caption lines -->
    <rect x="30" y="236" width="96" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.75"/>
    <rect x="30" y="252" width="62" height="6" rx="3" fill="#ffffff" fill-opacity="0.35"/>
  </g>
</svg>
